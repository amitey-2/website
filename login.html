
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Access | AN.</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b0b0b;
      color: #eee;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 390px;
      padding: 35px;
      background: #151515;
      border: 1px solid #333;
    }

    h1 {
      font-size: 32px;
      letter-spacing: 3px;
      margin-bottom: 8px;
    }

    p {
      color: #999;
      line-height: 1.6;
    }

    label {
      display: block;
      margin: 22px 0 8px;
      font-size: 13px;
      color: #bbb;
    }

    input {
      width: 100%;
      padding: 14px;
      background: #0b0b0b;
      color: white;
      border: 1px solid #444;
      outline: none;
    }

    input:focus {
      border-color: #c49a6c;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      background: #c49a6c;
      color: #111;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      min-height: 24px;
      font-size: 13px;
      margin-top: 15px;
    }

    .back {
      display: block;
      margin-top: 25px;
      color: #888;
      font-size: 12px;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <main class="login-box">
    <h1>AN.</h1>
    <p>Private space. Personal archive.<br>Welcome back.</p>

    <form id="loginForm">
      <label for="email">EMAIL</label>
      <input
        type="email"
        id="email"
        placeholder="Your email address"
        required
      >

      <label for="password">PASSWORD</label>
      <input
        type="password"
        id="password"
        placeholder="Your password"
        required
      >

      <button type="submit" id="loginButton">
        ENTER PRIVATE SPACE
      </button>

      <p id="message" role="status"></p>
    </form>

    <a class="back" href="index.html">← Back to public website</a>
  </main>

  <script type="module">
    import { createClient } from
      "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL =
      "https://fqbcfuduinjdumozfbja.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_CI3BreLTxzIgIB_IcdTg5Q_OyBVx1vw";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");

    // If already logged in, go to dashboard
    const { data: sessionData } =
      await supabase.auth.getSession();

    if (sessionData.session) {
      window.location.replace("dashboard.html");
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      button.disabled = true;
      button.textContent = "CHECKING...";
      message.textContent = "";

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const { error } = await supabase.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        message.textContent = error.message;
        button.disabled = false;
        button.textContent = "ENTER PRIVATE SPACE";
        return;
      }

      message.textContent = "Login successful. Welcome back!";
      window.location.replace("dashboard.html");
    });
  </script>
</body>
</html>
