<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#120b10">
  <title>Page Unavailable</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #120b10;
      color: #f6eaf0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }
    main { width: min(100%, 420px); }
    .heart { color: #d99ab5; font-size: 30px; }
    h1 {
      margin: 18px 0 10px;
      font-family: Georgia, serif;
      font-size: clamp(30px, 8vw, 42px);
      font-weight: 400;
    }
    p { color: #c8aeba; font-size: 15px; line-height: 1.7; }
  </style>
</head>
<body>
  <main>
    <div class="heart" aria-hidden="true">♡</div>
    <h1>This little page is resting.</h1>
    <p>Nothing to see here for now. Please check back another time.</p>
  </main>
</body>
</html>
